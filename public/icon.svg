<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141f3d"/>
      <stop offset="100%" stop-color="#070d1e"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#70f3ff"/>
      <stop offset="100%" stop-color="#006c74"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="4"/>

  <!-- Outer Reactor Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f0ff" stroke-width="8" stroke-dasharray="16 12" filter="url(#glow)"/>
  
  <!-- Middle Ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#26c6da" stroke-width="6" opacity="0.8"/>
  
  <!-- Reactor Core Segments -->
  <g transform="rotate(30 256 256)" stroke="#00f0ff" stroke-width="6" opacity="0.9">
    <line x1="256" y1="126" x2="256" y2="160"/>
    <line x1="256" y1="352" x2="256" y2="386"/>
    <line x1="126" y1="256" x2="160" y2="256"/>
    <line x1="352" y1="256" x2="386" y2="256"/>
  </g>

  <!-- Inner Glowing Reactor Core -->
  <circle cx="256" cy="256" r="70" fill="url(#coreGrad)" filter="url(#glow)"/>
  
  <!-- J.A.R.V.I.S. Lightning Bolt / Pulse -->
  <path d="M266 210 L236 260 L258 260 L246 302 L276 252 L254 252 Z" fill="#070d1e" stroke="#ffffff" stroke-width="2"/>
</svg>
